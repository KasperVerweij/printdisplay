[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^9.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson@^7.2
    bitbank2/JPEGDEC@1.8.5
build_flags =
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_SKIP=1
    -DLV_COLOR_FORMAT_DEFAULT=LV_COLOR_FORMAT_RGB565
    -DLV_USE_LOG=0
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_18=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_48=1
    ; Use the ESP32's real heap instead of LVGL's fixed-size static pool
    ; (that pool alone overflowed available DRAM on this chip).
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CLIB
    -DLV_USE_STDLIB_STRING=LV_STDLIB_CLIB
    -DLV_USE_STDLIB_SPRINTF=LV_STDLIB_CLIB
    ; Widgets/features this project doesn't use, to trim flash/RAM.
    -DLV_USE_GIF=0
    -DLV_USE_LOTTIE=0
    -DLV_USE_QRCODE=0
    -DLV_USE_BARCODE=0
    -DLV_USE_FFMPEG=0
    -DLV_USE_GSTREAMER=0
    -DLV_USE_3DTEXTURE=0
    -DLV_USE_IME_PINYIN=0
    -DLV_USE_CALENDAR=0
    -DLV_USE_MENU=0
    -DLV_USE_SPAN=0
    -DLV_USE_TABLE=0
    -DLV_USE_TABVIEW=0
    -DLV_USE_TILEVIEW=0
    -DLV_USE_WIN=0
    -DLV_USE_IMAGEBUTTON=0
    -DLV_USE_MSGBOX=0
    -DLV_USE_ARCLABEL=0
    -DLV_USE_ANIMIMAGE=0
